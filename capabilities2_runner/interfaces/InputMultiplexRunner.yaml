%YAML 1.1
---
name: InputMultiplexRunner
spec_version: 1.2
spec_type: interface
description: "This capability combines the results of all input by multiplexing events into a 
              single interface. It allows the robot to wait for multiple parallel processes at 
              once until completion. This is inserted by the system itself and planning entity
              does not need to include this in plans generated by it."